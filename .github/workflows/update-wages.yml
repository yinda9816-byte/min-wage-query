name: 每日更新最低工资数据

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wages:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 安装 Puppeteer
        run: npm install puppeteer

      - name: 安装 Chrome 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2 libatk-bridge2.0-0 libatk1.0-0 libcups2 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 \
            libnspr4 libnss3 libpango-1.0-0 libx11-6 libx11-xcb1 \
            libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxkbcommon0 libxrandr2 xdg-utils || true

      - name: 抓取最新最低工资数据
        run: node scripts/fetch-wages.cjs

      - name: 检查文件是否有变更
        id: check
        run: |
          if git diff --quiet src/data/wages.js src/data/update-log.js; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 提交更新
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/wages.js src/data/update-log.js
          git commit -m "chore(data): 自动更新最低工资数据 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          git push
